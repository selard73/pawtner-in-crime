<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who's Your Pawtner in Crime? 🚨🐾</title>
<meta name="description" content="Bonnie had Clyde. Thelma had Louise. Butch had Sundance. Take the Last Chance Ranch booking quiz, find out what you're in for, and meet the inmate who'd take the fall for you.">
<meta property="og:title" content="Who's Your Pawtner in Crime? 🚨🐾">
<meta property="og:description" content="Bonnie had Clyde. Thelma had Louise. Butch had Sundance. Get booked, find out what you're in for, and meet your pawtner in crime at Last Chance Ranch.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Permanent+Marker&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAE0C8; --paper-deep:#D9CDAF; --paper-light:#F3ECDA;
  --ink:#1B1A17; --ink-soft:#3B3830; --muted:#6B655A;
  --red:#B8231F; --red-deep:#8E1814; --red-stamp:#C4302B;
  --wood:#7A5230; --wood-light:#A6773F; --wood-dark:#4E3218;
  --wall:#B9B7B0; --wall-line:#7E7C76;
  --disp:'Anton','Oswald',Impact,sans-serif;
  --cond:'Oswald','Anton',Impact,sans-serif;
  --type:'Special Elite','Courier New',Courier,monospace;
  --chalk:'Permanent Marker','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--type); color:var(--ink); line-height:1.55;
  min-height:100vh; padding:24px 12px 44px;
  background-color:#2A2723;
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 46px),
    linear-gradient(180deg,#34302A 0%,#211E1A 100%);
}
main{max-width:660px;margin:0 auto;position:relative;z-index:1}

/* the file folder / parchment stage */
.stage{
  position:relative; background:var(--paper); color:var(--ink);
  border:2px solid #C9BD9E; padding:34px 26px 30px; text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 0 90px rgba(90,70,30,.18);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(120,90,40,.16), transparent 50%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 1px, transparent 1px 3px);
}
.stage::before{ /* worn edge */
  content:""; position:absolute; inset:6px; border:1px dashed rgba(60,45,20,.28); pointer-events:none;
}
.stage.result{padding-top:26px}
h1:focus,h2:focus{outline:none}

/* header strip like the card: LAST CHANCE RANCH / DEPARTMENT OF PAWCTIONS */
.dept{font-family:var(--cond); font-weight:700; letter-spacing:.22em; text-transform:uppercase; font-size:.78rem; color:var(--ink-soft)}
.dept b{display:block; font-family:var(--disp); font-weight:400; letter-spacing:.12em; font-size:1.25rem; color:var(--ink)}
.dept::before,.dept::after{content:"★"; color:var(--red); margin:0 .5em; font-size:.75em; vertical-align:middle}
.dept::after{display:none}
.dept b::before,.dept b::after{content:"—"; color:var(--ink-soft); margin:0 .4em; font-weight:400}
.rule{height:3px; background:var(--ink); margin:12px auto 18px; width:70%; position:relative}
.rule::after{content:""; position:absolute; left:0; right:0; top:5px; height:1px; background:var(--ink)}

.filehead{
  display:inline-block; font-family:var(--disp); font-size:clamp(2.2rem,8.5vw,3.4rem); letter-spacing:.06em;
  color:var(--ink); line-height:1; margin:4px 0 8px;
  background:linear-gradient(0deg, transparent 20%, var(--ink) 20% 80%, transparent 80%);
  padding:0 .3em; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:currentColor;
}
.hook{font-family:var(--type); font-size:1.02rem; color:var(--ink-soft); max-width:44ch; margin:0 auto 6px; line-height:1.55}
.hook strong{color:var(--ink)}
.title{
  font-family:var(--disp); font-weight:400; font-size:clamp(1.9rem,7vw,2.75rem);
  line-height:1.05; margin:10px 0 14px; color:var(--red); letter-spacing:.03em; text-transform:uppercase;
  text-shadow:2px 2px 0 rgba(0,0,0,.12);
}
.title em{font-style:normal; color:var(--ink)}
.lede{font-size:.98rem; color:var(--ink-soft); max-width:48ch; margin:0 auto 20px}
.fineprint{font-size:.78rem; color:var(--muted); margin-top:14px}

/* stamps */
.stamp{
  display:inline-block; font-family:var(--disp); text-transform:uppercase; letter-spacing:.08em;
  color:var(--red-stamp); border:4px double var(--red-stamp); padding:4px 12px; line-height:1;
  transform:rotate(-6deg); opacity:.92; mix-blend-mode:multiply;
  mask-image:radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.6) 100%);
}
.stamp.sm{font-size:.9rem; padding:3px 9px; border-width:3px}
.stamp.lg{font-size:1.9rem; padding:6px 16px}
.stamp.tilt-r{transform:rotate(5deg)}
.stamp.round{border-radius:50%; width:96px; height:96px; display:inline-flex; align-items:center; justify-content:center; text-align:center; font-size:.95rem; line-height:1.05; padding:0}

/* intro: mystery cells */
.cells{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:18px auto 22px; max-width:420px}
.cell{
  aspect-ratio:3/4; background:var(--wall); border:3px solid var(--ink); position:relative; overflow:hidden;
  background-image:repeating-linear-gradient(0deg, transparent 0 14px, var(--wall-line) 14px 15px);
  box-shadow:inset 0 0 18px rgba(0,0,0,.25);
}
.cell::before{ /* bars */
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg, rgba(20,20,20,.85) 0 5px, transparent 5px 19px);
}
.cell span{
  position:absolute; left:8%; right:8%; bottom:10%; background:#EFE7D2; border:2px solid var(--ink);
  font-family:var(--cond); font-weight:700; font-size:.62rem; letter-spacing:.06em; padding:3px 2px; line-height:1.15; color:var(--ink);
}
.cell i{position:absolute; top:12%; left:0; right:0; font-style:normal; font-family:var(--disp); font-size:2.2rem; color:var(--red); text-shadow:2px 2px 0 rgba(0,0,0,.25)}
@media (max-width:420px){.cells{grid-template-columns:repeat(4,1fr); gap:7px}}

/* progress: paw stamps */
.paws{display:flex;justify-content:center;gap:6px;margin-bottom:14px;font-size:1rem}
.paw{opacity:.18;transition:opacity .25s,transform .25s;display:inline-block;filter:grayscale(1)}
.paw.done{opacity:1;filter:none}
.paw.now{opacity:1;filter:none;transform:scale(1.4) rotate(12deg)}

/* questions */
.qnum{font-family:var(--cond); font-weight:700; letter-spacing:.2em; text-transform:uppercase; font-size:.72rem; color:var(--red); margin-bottom:6px}
.question{
  font-family:var(--cond); font-weight:700; font-size:clamp(1.3rem,5.2vw,1.7rem);
  line-height:1.22; margin-bottom:18px; color:var(--ink); text-transform:uppercase; letter-spacing:.02em;
}
.answers{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
.answer{
  font-family:var(--type); font-size:.97rem; text-align:left; line-height:1.4;
  background:var(--paper-light); color:var(--ink); border:2px solid var(--ink);
  padding:13px 16px 13px 44px; cursor:pointer; min-height:52px; width:100%; position:relative;
  box-shadow:3px 3px 0 rgba(27,26,23,.35);
  transition:transform .12s, background .12s, box-shadow .12s;
}
.answer::before{ /* checkbox */
  content:""; position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; border:2px solid var(--ink); background:#fff;
}
.answer:hover{background:#fff; transform:translate(-1px,-1px); box-shadow:5px 5px 0 rgba(27,26,23,.4)}
.answer:hover::before{background:#FBE9E8}
.answer:active{transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(27,26,23,.4)}
.answer.picked{background:#fff}
.answer.picked::before{content:"✔"; color:var(--red); font-size:15px; line-height:14px; text-align:center; font-weight:700}

/* buttons */
.btn{
  display:inline-block; font-family:var(--cond); font-weight:700; text-transform:uppercase; letter-spacing:.1em; font-size:1rem;
  padding:13px 26px; cursor:pointer; text-decoration:none; border:2px solid var(--ink);
  transition:transform .1s, box-shadow .1s;
}
.btn.primary{background:var(--red); color:#fff; box-shadow:0 5px 0 var(--red-deep)}
.btn.primary:hover{transform:translateY(-2px); box-shadow:0 7px 0 var(--red-deep)}
.btn.primary:active{transform:translateY(4px); box-shadow:0 1px 0 var(--red-deep)}
.btn.secondary{background:var(--ink); color:var(--paper); box-shadow:0 5px 0 #000}
.btn.secondary:hover{transform:translateY(-2px); box-shadow:0 7px 0 #000}
.btn.secondary:active{transform:translateY(4px); box-shadow:0 1px 0 #000}
.btn.fb{background:#1877F2; color:#fff; font-size:.92rem; padding:11px 20px; box-shadow:0 4px 0 #0E4DA4; border-color:#0E4DA4}
.btn.fb:hover{transform:translateY(-2px); box-shadow:0 6px 0 #0E4DA4}
.btn.fb:active{transform:translateY(3px); box-shadow:0 1px 0 #0E4DA4}
.btn.quiet{background:none; border:none; color:var(--ink-soft); padding:10px 14px; font-size:.85rem; letter-spacing:.06em; text-decoration:underline; text-underline-offset:3px; box-shadow:none}
.btn.quiet:hover{color:var(--red)}
:focus-visible{outline:3px solid var(--red); outline-offset:2px}

/* interstitial */
.census{padding:50px 0}
.siren{font-size:3rem; display:inline-block; animation:flash .7s ease-in-out infinite; margin-bottom:12px}
@keyframes flash{0%,100%{opacity:1; filter:drop-shadow(0 0 0 rgba(184,35,31,0))}50%{opacity:.6; filter:drop-shadow(0 0 14px rgba(184,35,31,.9))}}
.typing{font-family:var(--type); font-size:1rem; color:var(--ink-soft)}
.typing::after{content:"▌"; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ===== RESULT: the Inmate File ===== */
.file{ text-align:left }
.filetop{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px}
.filetop .dept{text-align:left; font-size:.68rem}
.filetop .dept b{font-size:1.05rem}
.wanted{ text-align:center; margin:4px 0 12px }
.wanted .stamp{font-size:1.4rem}
.wanted small{display:block; font-family:var(--cond); font-weight:700; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--red-stamp); margin-top:2px}

.charge{
  background:var(--ink); color:var(--paper); padding:12px 16px; margin:8px 0 16px; text-align:center;
  font-family:var(--type); font-size:.95rem;
}
.charge b{display:block; font-family:var(--disp); font-size:1.5rem; letter-spacing:.06em; color:#F4E4B0; text-transform:uppercase; line-height:1.15}
.charge span{opacity:.85}

.mugwrap{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:14px; align-items:start; margin-bottom:14px}
@media (max-width:520px){.mugwrap{grid-template-columns:1fr}}
.mug{
  position:relative; aspect-ratio:3/4; background:var(--wall); border:3px solid var(--ink); overflow:hidden;
  background-image:repeating-linear-gradient(0deg, transparent 0 22px, var(--wall-line) 22px 24px);
  box-shadow:inset 0 0 30px rgba(0,0,0,.25);
}
.mug img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.mug .ticks{position:absolute; left:6px; top:8px; bottom:0; font-family:var(--cond); font-weight:700; font-size:.6rem; color:var(--ink); line-height:24px}
.mug .ticks i{display:block; font-style:normal}
.mug .sil{position:absolute; left:50%; bottom:22%; transform:translateX(-50%); font-size:5.2rem; opacity:.55; filter:grayscale(1) contrast(1.4)}
.sign{
  position:absolute; left:8%; right:8%; bottom:6%; padding:6px 6px 7px; text-align:center;
  background:linear-gradient(180deg,var(--wood-light),var(--wood) 60%,var(--wood-dark)); border:2px solid var(--wood-dark);
  color:#F6EAD0; box-shadow:0 4px 8px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 3px, transparent 3px 11px), linear-gradient(180deg,var(--wood-light),var(--wood) 60%,var(--wood-dark));
}
.sign small{display:block; font-family:var(--cond); font-weight:700; font-size:.55rem; letter-spacing:.14em; text-transform:uppercase; opacity:.9}
.sign b{display:block; font-family:var(--chalk); font-size:1.15rem; line-height:1.15; letter-spacing:.02em}
.sign::before,.sign::after{content:""; position:absolute; top:-40px; width:2px; height:40px; background:repeating-linear-gradient(180deg,#333 0 4px,#999 4px 6px)}
.sign::before{left:12%}.sign::after{right:12%}

.fields{font-family:var(--type); font-size:.9rem; line-height:1.35}
.fields dt{font-family:var(--cond); font-weight:700; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:7px}
.fields dd{font-family:var(--cond); font-weight:700; font-size:1.02rem; text-transform:uppercase; letter-spacing:.02em; color:var(--ink); border-bottom:1px solid rgba(27,26,23,.35); padding-bottom:2px}
.fields dd.name{font-family:var(--disp); font-size:1.7rem; color:var(--red); letter-spacing:.06em; border-bottom:2px solid var(--ink)}
.fields dd.name small{font-family:var(--type); font-size:.85rem; color:var(--ink-soft); text-transform:none; letter-spacing:0}
.fields dd.pending{color:var(--muted); font-family:var(--type); text-transform:none; font-weight:400; font-size:.85rem}

.sec{margin-top:16px}
.sechead{
  font-family:var(--cond); font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:.8rem;
  background:var(--ink); color:var(--paper); display:inline-block; padding:3px 12px; margin-bottom:8px;
}
.sechead.red{background:var(--red)}
.report{list-style:none; columns:2; column-gap:18px; font-family:var(--cond); font-weight:700; text-transform:uppercase; font-size:.86rem; letter-spacing:.02em}
@media (max-width:420px){.report{columns:1}}
.report li{break-inside:avoid; padding-left:20px; position:relative; margin-bottom:5px}
.report li::before{content:"🐾"; position:absolute; left:0; top:0; font-size:.75rem}
.notes{font-family:var(--type); font-size:.93rem; line-height:1.6; color:var(--ink)}
.notes p{margin-bottom:9px}
.notes .parole{color:var(--red); font-weight:700}
.reportwrap{display:flex; gap:12px; align-items:flex-start; justify-content:space-between}
.reportwrap .stamp.round{flex:0 0 auto; margin-top:6px}

.parole{margin-top:16px; border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); padding:12px 8px; text-align:center}
.parole h3{font-family:var(--disp); font-size:1.35rem; letter-spacing:.06em; color:var(--ink)}
.parole h3::before,.parole h3::after{content:"★"; color:var(--red); margin:0 .4em; font-size:.7em; vertical-align:middle}
.parole p{font-family:var(--cond); font-weight:700; text-transform:uppercase; font-size:.8rem; letter-spacing:.06em; color:var(--red)}
.parole .cond{font-family:var(--type); text-transform:none; letter-spacing:0; color:var(--ink-soft); font-size:.86rem; font-weight:400; margin-top:4px}

.ctas{display:flex; flex-direction:column; gap:12px; align-items:center; margin:18px 0 22px; text-align:center}
.ctas .lock{font-family:var(--cond); font-weight:700; text-transform:uppercase; font-size:.85rem; letter-spacing:.06em; color:var(--ink)}
.ctas .lock b{color:var(--red)}
.btnrow{display:flex; flex-wrap:wrap; justify-content:center; gap:6px}

/* the rest of the block */
.block{border-top:2px dashed rgba(27,26,23,.4); padding-top:16px; margin-bottom:6px; text-align:center}
.blocklabel{font-family:var(--cond); font-weight:700; font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:12px}
.blockgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px 6px}
.inmate{display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--ink); font-family:var(--cond); font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; background:none; border:0}
.inmate .thumb{width:62px; height:74px; border:2px solid var(--ink); background:var(--wall); background-image:repeating-linear-gradient(0deg, transparent 0 9px, var(--wall-line) 9px 10px); display:flex; align-items:flex-end; justify-content:center; overflow:hidden; position:relative; transition:transform .15s}
.inmate .thumb img{width:100%; height:100%; object-fit:cover; display:block}
.inmate .thumb i{font-style:normal; font-size:1.7rem; filter:grayscale(1); opacity:.6; margin-bottom:6px}
.inmate .thumb em{position:absolute; left:4px; right:4px; bottom:4px; background:var(--wood); color:#F6EAD0; font-style:normal; font-family:var(--cond); font-size:.5rem; letter-spacing:.06em; padding:1px 0}
.inmate:hover .thumb{transform:scale(1.06) rotate(-2deg); border-color:var(--red)}
.inmate:hover span{color:var(--red)}

.visit{border-top:2px dashed rgba(27,26,23,.4); padding-top:14px; font-size:.82rem; color:var(--ink-soft); text-align:center}
.visit a{color:var(--ink); font-weight:700}
footer{max-width:660px; margin:22px auto 0; text-align:center; font-size:.78rem; color:#C9BD9E; position:relative; z-index:1; font-family:var(--type)}
footer a{color:#F4E4B0; font-weight:700}

/* reveal cascade */
.reveal-1,.reveal-2,.reveal-3,.reveal-4,.reveal-5{opacity:0; transform:translateY(12px); animation:rise .5s cubic-bezier(.2,1.2,.4,1) forwards}
.reveal-2{animation-delay:.12s}.reveal-3{animation-delay:.3s}.reveal-4{animation-delay:.55s}.reveal-5{animation-delay:.85s}
@keyframes rise{to{opacity:1; transform:translateY(0)}}
.slam{animation:slam .45s cubic-bezier(.2,1.6,.4,1) .9s both}
@keyframes slam{0%{transform:scale(2.4) rotate(-6deg); opacity:0}70%{transform:scale(.95) rotate(-6deg); opacity:1}100%{transform:scale(1) rotate(-6deg); opacity:.92}}

/* typewriter */
.tw-hide{visibility:hidden}
.tw-cursor::after{content:"▌"; color:var(--red); animation:blink .8s steps(1) infinite; margin-left:1px}
.later{opacity:0; transition:opacity .5s}
.later:not(.on){pointer-events:none}
.later.on{opacity:1}
.mute{position:fixed; top:10px; right:10px; z-index:60; background:var(--ink); color:var(--paper); border:2px solid var(--paper); font-size:1rem; width:38px; height:38px; cursor:pointer; box-shadow:2px 2px 0 #000}
.mute:hover{background:var(--red)}
.skiphint{font-family:var(--cond); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:center; margin:-6px 0 8px}

/* intro choreography */
.stage.intro{animation:paperdrop .55s cubic-bezier(.2,1.2,.4,1) both}
@keyframes paperdrop{0%{transform:translateY(-40px) rotate(-1.2deg); opacity:0}100%{transform:none; opacity:1}}
.stage.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-1px,1px)}20%,80%{transform:translate(2px,-1px)}30%,50%,70%{transform:translate(-3px,1px) rotate(-.2deg)}40%,60%{transform:translate(3px,-1px) rotate(.2deg)}}
.slamin{opacity:0}
.slamin.on{animation:slamin .42s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes slamin{0%{transform:scale(2.6) rotate(-4deg); opacity:0}65%{transform:scale(.94) rotate(0); opacity:1}100%{transform:none; opacity:1}}
.title.slamin.on{animation-name:slamin-red}
@keyframes slamin-red{0%{transform:scale(2.2) rotate(-3deg); opacity:0; filter:blur(2px)}60%{transform:scale(.96); opacity:1; filter:none}100%{transform:none; opacity:1}}
.hook .line{display:inline-block; opacity:0; transform:translateY(10px)}
.hook .line.on{animation:punch .32s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes punch{0%{opacity:0; transform:translateY(12px) scale(.9)}70%{opacity:1; transform:translateY(-2px) scale(1.04)}100%{opacity:1; transform:none}}
.rule.draw{transform:scaleX(0); transform-origin:left; transition:transform .5s cubic-bezier(.2,1,.3,1)}
.rule.draw.on{transform:scaleX(1)}
.cell.later{transform:scale(.4) rotate(-10deg); transition:opacity .28s, transform .38s cubic-bezier(.2,1.7,.4,1)}
.cell.later.on{transform:none}
.cell.later.on i{animation:qpop .5s .1s ease-out both}
@keyframes qpop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.3) rotate(6deg)}100%{transform:none}}
.btn.primary.land{opacity:0}
.btn.primary.land.on{animation:land .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes land{0%{opacity:0; transform:translateY(-30px) scale(1.15)}70%{opacity:1; transform:translateY(3px) scale(.98)}100%{opacity:1; transform:none}}
.lede.tw{min-height:4.6em}

/* Book Me pulse */
.btn.pulse{animation:pulse 1.6s ease-in-out infinite; position:relative}
@keyframes pulse{0%,100%{transform:translateY(0) scale(1); box-shadow:0 5px 0 var(--red-deep), 0 0 0 0 rgba(184,35,31,.55)}50%{transform:translateY(-2px) scale(1.04); box-shadow:0 7px 0 var(--red-deep), 0 0 0 14px rgba(184,35,31,0)}}
.btn.pulse::after{content:"👉"; position:absolute; left:-44px; top:50%; transform:translateY(-50%); font-size:1.4rem; animation:point .9s ease-in-out infinite}
@keyframes point{0%,100%{transform:translate(0,-50%)}50%{transform:translate(-8px,-50%)}}
.cell.later{transform:scale(.6) rotate(-6deg); transition:opacity .35s, transform .35s cubic-bezier(.2,1.6,.4,1)}
.cell.later.on{transform:none}
.answer.later{transform:translateX(-14px); transition:opacity .3s, transform .3s cubic-bezier(.2,1.4,.4,1)}
.answer.later.on{transform:none}

/* toast */
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,16px); background:var(--ink); color:var(--paper); font-family:var(--cond); font-size:.9rem; font-weight:700; letter-spacing:.06em; padding:12px 22px; border:2px solid var(--paper); opacity:0; transition:opacity .35s, transform .35s; z-index:50; max-width:88vw; text-align:center}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:480px){.stage{padding:26px 16px 22px} body{padding:14px 8px 34px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important; transition:none !important} .reveal-1,.reveal-2,.reveal-3,.reveal-4,.reveal-5,.slam{opacity:1; transform:none}}

const $ = s => document.querySelector(s);
const stage = $("#stage");
const ACTIVE = () => Object.keys(DOGS).filter(k => !DOGS[k].hidden);
let answers = [];
let current = 0;

function setScreen(html, cls){

  `, "intro");
  runIntroSequence(nCells);
}
const shake = () => { stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); };
async function runIntroSequence(nCells){
  const run = ++twRun;
  const on = sel => document.querySelectorAll(sel).forEach(e => e.classList.add("on"));
  const lede = document.querySelector(".lede.tw");
  const btn = document.querySelector(".btn.primary");
  const finish = () => { on(".rule.draw,.slamin,.hook .line,.cell,.btn.primary.land,.later"); btn.classList.remove("land"); btn.classList.add("pulse"); if (lede) lede.classList.remove("tw-hide","tw-cursor"); };
  if (REDUCE){ finish(); return; }
  lede.classList.add("tw-hide");
  const original = lede.innerHTML;
  const cancelled = () => { if (twRun !== run) { lede.innerHTML = original; lede.classList.remove("tw-hide","tw-cursor"); return true; } return false; };
  const skip = () => { if (twRun === run) { twRun++; lede.innerHTML = original; finish(); } };
  stage.addEventListener("click", skip, { once: true });

  await sleep(450); if (cancelled()) return;          // paper drops in
  on(".rule.draw");
  await sleep(350);
  on(".filehead.slamin"); stampSound(); setTimeout(shake, 220);   // INMATE FILE slams
  await sleep(650);
  const lines = document.querySelectorAll(".hook .line");
  for (const l of lines) { l.classList.add("on"); click(); await sleep(380); if (cancelled()) return; }
  await sleep(150);
  on(".title.slamin"); stampSound(); setTimeout(shake, 200);       // title stamps in red
  await sleep(600);
  for (let i = 0; i < nCells; i++) { showStep(String(i)); click(); await sleep(70); if (cancelled()) return; }
  await sleep(250);
  on(".btn.primary.land"); stampSound(); setTimeout(shake, 250);   // Book Me lands
  await sleep(500);
  btn.classList.remove("land"); btn.classList.add("pulse"); showStep("fine");
  await typeInto(lede, run, 12); if (cancelled()) return;          // lede types while button pulses
  stage.removeEventListener("click", skip);
}

/* ---------- questions ---------- */
function showQuestion(i){
  current = i;
  const qq = QUESTIONS[i];
  const paws = QUESTIONS.map((_, n) => `<span class="paw ${n < i ? "done" : ""} ${n === i ? "now" : ""}">🐾</span>`).join("");
  const opts = qq.a.map((a, ai) => `<button class="answer later ${answers[i] === ai ? "picked" : ""}" data-step="a${ai}" onclick="pick(${ai})">${a[0]}</button>`).join("");
  setScreen(`
    ${header()}
    <p class="qnum">Booking form · Question ${i + 1} of ${QUESTIONS.length}</p>
    <div class="paws" role="img" aria-label="Question ${i + 1} of ${QUESTIONS.length}">${paws}</div>
    <h2 class="question tw">${qq.q}</h2>
    <div class="answers">${opts}</div>
    ${i > 0 ? `<button class="btn quiet later" data-step="back" onclick="showQuestion(${i - 1})">← Back</button>` : ""}
  `, "quiz");
  runQuestionTypewriter(qq.a.length);
}
async function runQuestionTypewriter(nAnswers){
  const run = ++twRun;
  const q = document.querySelector(".question.tw");
  if (REDUCE){ finishAll(); return; }
  q.classList.add("tw-hide");
  const original = q.innerHTML;
  const cancelled = () => { if (twRun !== run) { q.innerHTML = original; q.classList.remove("tw-hide","tw-cursor"); return true; } return false; };
  const skip = () => { if (twRun === run) { twRun++; q.innerHTML = original; finishAll(); } };
  stage.addEventListener("click", skip, { once: true });
  await sleep(150); if (cancelled()) return;
  await typeInto(q, run, 22); if (cancelled()) return;
  ding(); await sleep(200);
  for (let k = 0; k < nAnswers; k++) { showStep("a" + k); click(); await sleep(140); if (cancelled()) return; }
  showStep("back");
  stage.removeEventListener("click", skip);
}
function pick(ai){
  answers[current] = ai;
  if (current + 1 < QUESTIONS.length) showQuestion(current + 1);
  else showInterstitial();
}

/* ---------- scoring ---------- */
function computeWinner(){
  const score = {}, charge = {};
  ACTIVE().forEach(k => score[k] = 0);
  answers.forEach((ai, qi) => {
    const a = QUESTIONS[qi].a[ai];
    let p = a[1], s = a[2];
    if (DOGS[p].hidden) { p = s; }                 // hidden primary → secondary takes the +2
    if (score[p] !== undefined) score[p] += 2;
    if (s !== p && score[s] !== undefined) score[s] += 1;
    charge[a[3]] = (charge[a[3]] || 0) + 1;
  });
  const best = Math.max(...Object.values(score));
  const leaders = Object.keys(score).filter(k => score[k] === best);
  const dog = leaders[Math.floor(Math.random() * leaders.length)];
  const topC = Math.max(...Object.values(charge));
  const cLeaders = Object.keys(charge).filter(k => charge[k] === topC);
  return { dog, charge: cLeaders[0] };
}

    <div class="sign"><small>Last Chance Ranch Prison</small><b>Inmate ${num}<br>${label}</b></div>
  </div>`;
}
function field(label, val, cls){

  setScreen(`
    <div class="file">
      <div class="filetop">
        <p class="dept">Last Chance Ranch<b>Department of Pawctions</b></p>
        <span class="stamp sm tilt-r later" data-step="0">Booked</span>
      </div>
      <p class="skiphint">Tap anywhere to skip the typing</p>
      <div class="charge">
        <span class="tw">Booking complete. You are hereby charged with</span>
        <b class="tw">${CHARGES[charge]}</b>
      </div>
      <div class="wanted later" data-step="1"><span class="stamp lg slam">Wanted</span><small>for a better life — together</small></div>
      <h1 class="title tw" style="text-align:center">Your pawtner in crime is <em>${displayName}</em></h1>
      <div class="mugwrap">
        <div class="later" data-step="2">${mugshot(key, d)}</div>
        <dl class="fields">
          ${field("Name", `${d.name}${d.aka ? ` <small>(aka “${d.aka}”)</small>` : ""}`, "name tw")}
          ${field("Inmate No.", numLine.replace(/^Inmates? /, ""), "tw")}
          ${field("Rank", d.rank, "tw")}
          ${field("Breed", d.breed, "tw")}
          ${field("Status", d.sex, "tw")}
          ${field("Age", d.age, "tw")}
          ${field("Weight", d.weight, "tw")}
          ${field("Custody", d.status, "tw")}
        </dl>
      </div>
      <div class="sec">
        <span class="sechead later" data-step="3">Behavior Report</span>
        <div class="reportwrap">
          <ul class="report">${report.replace(/<li>/g, '<li class="tw">')}</ul>
          <span class="stamp round later" data-step="4">★ ${goodStamp} ★</span>
        </div>
      </div>
      <div class="sec">
        <span class="sechead red later" data-step="5">Warden's Notes</span>
        <div class="notes">${notes.replace(/<p>/g, '<p class="tw">')}</div>
      </div>
      <div class="parole later" data-step="6">
        <h3>Parole Eligibility</h3>
        <p>Approved adopter willing to provide structure, exercise, and a lifelong commitment.</p>
        <p class="cond"><strong>Conditions of parole:</strong> ${d.conditions}</p>
      </div>
      <div class="ctas later" data-step="7">
        <p class="lock">🔒 Help <b>${displayName}</b> break free from the system and start a new life</p>
        <a class="btn primary" href="${LINKS.apply}" target="_blank" rel="noopener">Apply for Parole Today</a>
        <div class="btnrow">
          <a class="btn secondary" href="${LINKS.donate}" target="_blank" rel="noopener">Post Bail 💵</a>
          <a class="btn secondary" href="${LINKS.foster}" target="_blank" rel="noopener">Foster (Halfway House)</a>
        </div>
        <div class="btnrow">
          <button class="btn fb" onclick="shareFB('${key}')">Share on Facebook 📣</button>
        </div>
        <div class="btnrow">
          <button class="btn quiet" onclick="shareResult('${key}','${charge}')">Share another way</button>
          <button class="btn quiet" onclick="showIntro()">Get booked again</button>
        </div>
      </div>
      <div class="block later" data-step="8">
        <p class="blocklabel">The rest of the cell block — all real, all awaiting parole</p>
        <div class="blockgrid">${others}</div>
      </div>
      <div class="visit later" data-step="8">
        <p><strong>Last Chance Ranch</strong> · Department of Pawctions<br>
        A small no-kill rescue in South Carolina. Every inmate leaves alive.<br>
        <a href="tel:+18034798408">(803) 479-8408</a> · <a href="mailto:lastchanceranchofsc@gmail.com">lastchanceranchofsc@gmail.com</a> · <a href="${LINKS.page}" target="_blank" rel="noopener">Facebook</a></p>
      </div>
    </div>
  `, "result");
  runTypewriter();
}

/* ---------- typewriter engine ---------- */
const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let twRun = 0;                     // increments to cancel an in-flight run
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let muted = store.get("pic-muted") === "1";
let actx = null;

function ensureAudio(){
  if (muted || REDUCE) return null;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e){ return null; }
  return actx;
}
/* Optional real samples: drop files in sounds/ (key.mp3|wav, ding.mp3|wav, stamp.mp3|wav). Falls back to synth if missing. */
/* key1..key5 rotate randomly (real strikes never sound identical); key.* alone also works. */
const SAMPLES = { key: [], ding: null, stamp: null };
(function loadSamples(){
  const c = (() => { try { return new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } })();
  if (!c) return; actx = c;
  const load = name => ["wav","mp3","ogg"].reduce((p, ext) => p.then(ok => ok || fetch(`sounds/${name}.${ext}`)
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(ab => c.decodeAudioData(ab)).catch(() => null)
    .then(buf => buf ? (buf.__name = name, buf) : false)), Promise.resolve(false));
  ["key","key1","key2","key3","key4","key5"].forEach(n => load(n).then(b => { if (b) SAMPLES.key.push(b); }));
  load("ding").then(b => { if (b) SAMPLES.ding = b; });
  load("stamp").then(b => { if (b) SAMPLES.stamp = b; });
})();
function playSample(name, gainVal, rateJitter){
  const c = ensureAudio(); if (!c) return false;
  let buf = SAMPLES[name];
  if (Array.isArray(buf)) buf = buf.length ? buf[Math.floor(Math.random() * buf.length)] : null;
  if (!buf) return false;
  const src = c.createBufferSource(); src.buffer = buf;
  src.playbackRate.value = 1 + (Math.random() * 2 - 1) * (rateJitter || 0);
  const g = c.createGain(); g.gain.value = gainVal || 1;
  src.connect(g); g.connect(c.destination); src.start();
  return true;
}
function click(){                  // one typewriter key strike
  if (playSample("key", 0.9, 0.08)) return;
  const c = ensureAudio(); if (!c) return;
  // manual-typewriter strike: a low "thunk" (body) + a short dry "click" (typebar) layered
  const t = c.currentTime;
  const len = Math.floor(c.sampleRate * 0.06);
  const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  const src = c.createBufferSource(); src.buffer = buf;
  const lo = c.createBiquadFilter(); lo.type = "lowpass"; lo.frequency.value = 900 + Math.random() * 200; lo.Q.value = 0.7;
  const g = c.createGain(); g.gain.value = 0.7 + Math.random() * 0.2;
  src.connect(lo); lo.connect(g); g.connect(c.destination); src.start(t);
  // body thump
  const o = c.createOscillator(), og = c.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(190 + Math.random() * 40, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.05);
  og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  o.connect(og); og.connect(c.destination); o.start(t); o.stop(t + 0.08);
  // typebar tick
  const clen = Math.floor(c.sampleRate * 0.012);
  const cb = c.createBuffer(1, clen, c.sampleRate), cd = cb.getChannelData(0);
  for (let i = 0; i < clen; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / clen);
  const cs = c.createBufferSource(); cs.buffer = cb;
  const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2500;
  const cg = c.createGain(); cg.gain.value = 0.12;
  cs.connect(hp); hp.connect(cg); cg.connect(c.destination); cs.start(t);
}
function ding(){                   // carriage-return bell
  if (playSample("ding", 0.8, 0)) return;
  const c = ensureAudio(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.value = 980;
  g.gain.setValueAtTime(0.14, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + 0.5);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.5);
}
function stampSound(){             // rubber stamp thud
  if (playSample("stamp", 1, 0.05)) return;
  const c = ensureAudio(); if (!c) return;
  const len = Math.floor(c.sampleRate * 0.09);
  const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 320;
  const g = c.createGain(); g.gain.value = 0.9;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* type an element's content in place, preserving inline tags */
async function typeInto(el, run, cps){
  const tpl = el.cloneNode(true);
  el.innerHTML = ""; el.classList.remove("tw-hide"); el.classList.add("tw-cursor");
  let n = 0;
  async function walk(src, dst){
    for (const node of Array.from(src.childNodes)){
      if (twRun !== run) return;
      if (node.nodeType === 3){
        const t = document.createTextNode(""); dst.appendChild(t);
        for (const ch of node.nodeValue){
          if (twRun !== run) return;
          t.nodeValue += ch;
          if (ch !== " " && (n++ % 2 === 0)) click();
          await sleep(cps + (ch === "." || ch === "," ? 90 : 0));
        }
      } else {
        const c = node.cloneNode(false); dst.appendChild(c); await walk(node, c);
      }
    }
  }
  await walk(tpl, el);
  el.classList.remove("tw-cursor");
}
function showStep(i){
  document.querySelectorAll(`.later[data-step="${i}"]`).forEach(e => e.classList.add("on"));
}
function finishAll(){
  twRun++;
  document.querySelectorAll(".tw-hide").forEach(e => e.classList.remove("tw-hide"));
  document.querySelectorAll(".tw-cursor").forEach(e => e.classList.remove("tw-cursor"));
  document.querySelectorAll(".later").forEach(e => e.classList.add("on"));
  const h = document.querySelector(".skiphint"); if (h) h.remove();
}
async function runTypewriter(){
  const run = ++twRun;
  const targets = Array.from(document.querySelectorAll(".tw"));
  if (REDUCE){ finishAll(); return; }
  targets.forEach(e => e.classList.add("tw-hide"));
  const originals = new Map(targets.map(e => [e, e.innerHTML]));
  const restoreIfCancelled = () => { if (twRun !== run) { originals.forEach((html, e) => { e.innerHTML = html; e.classList.remove("tw-hide","tw-cursor"); }); return true; } return false; };
  const skip = () => { if (twRun === run) { twRun++; originals.forEach((html, e) => { e.innerHTML = html; }); finishAll(); } };
  stage.addEventListener("click", skip, { once: true });

  await sleep(350); if (restoreIfCancelled()) return;
  showStep(0); stampSound();
  await sleep(300);
  // charge line + charge
  for (const el of targets.filter(e => e.closest(".charge"))) { await typeInto(el, run, 26); if (restoreIfCancelled()) return; }
  ding(); await sleep(400);
  showStep(1); stampSound();               // WANTED slams
  await sleep(700);
  const title = targets.find(e => e.classList.contains("title"));
  if (title) { await typeInto(title, run, 34); if (restoreIfCancelled()) return; }
  ding(); showStep(2);                       // mugshot fades in
  await sleep(500);
  for (const el of targets.filter(e => e.closest(".fields"))) { await typeInto(el, run, 22); if (restoreIfCancelled()) return; await sleep(60); }
  ding(); await sleep(300);
  showStep(3);
  for (const el of targets.filter(e => e.closest(".report"))) { await typeInto(el, run, 16); if (restoreIfCancelled()) return; await sleep(80); }
  showStep(4); stampSound();                 // GOOD BOY stamp
  await sleep(500);
  showStep(5);
  for (const el of targets.filter(e => e.closest(".notes"))) { await typeInto(el, run, 9); if (restoreIfCancelled()) return; ding(); await sleep(250); }
  showStep(6); await sleep(350);
  showStep(7); await sleep(250);
  showStep(8);
  const h = document.querySelector(".skiphint"); if (h) h.remove();
  stage.removeEventListener("click", skip);
}
(function muteButton(){
  const b = document.createElement("button");
  b.className = "mute"; b.title = "Sound on/off"; b.setAttribute("aria-label", "Toggle typewriter sound");
  const paint = () => b.textContent = muted ? "🔇" : "🔊";
  paint();
  b.onclick = () => { muted = !muted; store.set("pic-muted", muted ? "1" : "0"); paint(); if (!muted) ensureAudio(); };
  document.body.appendChild(b);
})();

/* view another dog's file without retaking (keeps your charge) */
function showDog(key){ showResult(key); }

/* ---------- share ---------- */
function shareUrl(key){ return new URL("share/" + key + ".html", location.href).href; }
function shareFB(key){
  window.open("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(shareUrl(key)), "_blank", "noopener,width=626,height=436");
}
function shareResult(key, charge){
  const d = DOGS[key];
  const name = d.pair ? `${d.name} & ${d.pair.name}` : d.name;
  const text = `Bonnie had Clyde. I've got ${name}, Inmate #${d.num || "??"} — and I'm in for ${CHARGES[charge]}. 🚨🐾 Every one of these inmates is real and awaiting parole at Last Chance Ranch. Who's your pawtner in crime?`;
  const url = shareUrl(key);
  if (navigator.share) navigator.share({ title: "Who's Your Pawtner in Crime?", text, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text + " " + url).then(() => toast("Copied — paste it anywhere 🚨"));
  else toast("Copy the page link to share");
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("show"), 20);
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 400); }, 2600);
}

showIntro();
</script>
